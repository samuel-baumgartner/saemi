name: Build Saemi Goals widget APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-goals-widget/**'
      - '.github/workflows/android-goals-widget-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        run: |
          chmod +x android-goals-widget/gradlew
          cd android-goals-widget && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: saemi-goals-widget-debug-apk
          path: android-goals-widget/app/build/outputs/apk/debug/*.apk
